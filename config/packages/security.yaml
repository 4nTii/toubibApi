security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Users
                property: email

    firewalls:
        login:
            pattern: ^/api/auth
            stateless: true
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api, methods: [OPTIONS], roles: PUBLIC_ACCESS }
        - { path: ^/api/status/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/search, roles: PUBLIC_ACCESS }
        - { path: ^/api/doctor/\d+, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/doctor/login/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify-account/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/forgot-password/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/check-reset-token/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/reset-password/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }
