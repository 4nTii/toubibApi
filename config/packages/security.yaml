security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Users
                property: email

    firewalls:
        login:
            pattern: ^/api/login
            stateless: true
            # json_login:
            #   check_path: /api/login
            #   username_path: username
            #   password_path: password
            #   success_handler: lexik_jwt_authentication.handler.authentication_success
            #   failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/status/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify-account/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/forgot-password/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/check-reset-token/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/reset-password/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }
