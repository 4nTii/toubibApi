services:

  # -----------------------------------------
  # PHP-FPM Application
  # -----------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toubib_app
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}?serverVersion=8.0&charset=utf8mb4
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MAILER_DSN: ${MAILER_DSN}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    volumes:
      - app_var:/var/www/html/var
      - jwt_keys:/var/www/html/config/jwt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toubib_network

  # -----------------------------------------
  # Nginx reverse proxy
  # -----------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: toubib_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - toubib_network

  # -----------------------------------------
  # MySQL 8
  # -----------------------------------------
  db:
    image: mysql:8.0
    container_name: toubib_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - toubib_network

  # -----------------------------------------
  # Redis (Messenger transport + cache)
  # -----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: toubib_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - toubib_network


volumes:
  db_data:
  redis_data:
  app_var:
  jwt_keys:
  nginx_logs:

networks:
  toubib_network:
    driver: bridge
